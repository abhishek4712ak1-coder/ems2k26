services:
  - type: web
    name: zest-2k26
    runtime: node
    plan: starter
    buildCommand: npm ci --prefix server && npm ci --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM_NAME
        value: Zest 2k26 Admin
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
    disk:
      name: zest-uploads
      mountPath: /opt/render/project/src/server/uploads
      sizeGB: 1